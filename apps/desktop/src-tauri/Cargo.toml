[package]
name = "collabview"
version = "0.1.0"
description = "Low-latency collaborative game viewpoint sharing for OBS"
authors = ["CollabView contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "collabview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
directories = "6.0.0"
keyring = { version = "3.6.2", features = ["apple-native"] }
parking_lot = "0.12.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2.6.2", features = [] }
tauri-plugin-opener = "2.4.0"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["io-util", "process", "rt", "time"] }
tracing = "0.1.41"

[dev-dependencies]
tempfile = "3.20.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
