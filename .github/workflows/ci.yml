name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  lint-test:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install pkg-config srt openssl@3
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  macos-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install pkg-config srt openssl@3 ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: swift build --package-path apps/capture-helper -c release -Xswiftc -parse-as-library
      - run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp apps/capture-helper/.build/release/collabview-capture-helper \
            apps/desktop/src-tauri/binaries/collabview-capture-helper-aarch64-apple-darwin
      - run: scripts/bundle-ffmpeg-from-homebrew.sh /opt/homebrew/bin/ffmpeg
      - run: node node_modules/vite/bin/vite.js build
        working-directory: apps/desktop
      - run: scripts/import-apple-certificate.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      - run: |
          mkdir -p target
          set +e
          pnpm --filter @collabview/desktop tauri build --bundles app --config '{"build":{"beforeBuildCommand":""}}' --ci 2>&1 | tee target/macos-tauri-build.log
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CollabView-macos-build-logs
          path: target/macos-tauri-build.log
      - run: |
          xattr -cr target/release/bundle/macos/CollabView.app
          codesign --force --deep --sign - --timestamp=none target/release/bundle/macos/CollabView.app
          codesign --verify --deep --strict --verbose=4 target/release/bundle/macos/CollabView.app
      - run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARCH_NAME="aarch64"
          if [[ "$(uname -m)" == "x86_64" ]]; then
            ARCH_NAME="x64"
          fi
          mkdir -p target/release/bundle/dmg
          hdiutil create \
            -volname CollabView \
            -srcfolder target/release/bundle/macos/CollabView.app \
            -ov \
            -format UDZO \
            "target/release/bundle/dmg/CollabView_${VERSION}_${ARCH_NAME}.dmg"
      - run: scripts/build-pkg.sh
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          COLLABVIEW_NOTARIZE_PKG: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY != '' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: CollabView-macos
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.pkg

  windows-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install ffmpeg nsis -y
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w prepare:sidecars
        env:
          COLLABVIEW_TARGET_TRIPLE: x86_64-pc-windows-msvc
          COLLABVIEW_WINDOWS_FFMPEG_PATH: C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffmpeg.exe
      - run: node node_modules/vite/bin/vite.js build
        working-directory: apps/desktop
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          pnpm --filter @collabview/desktop tauri build --config src-tauri/tauri.windows.conf.json --ci 2>&1 | Tee-Object -FilePath target/windows-tauri-build.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CollabView-windows-build-logs
          path: target/windows-tauri-build.log
      - name: Push Windows build log for diagnostics
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/collabview-windows-build-log
          cp target/windows-tauri-build.log /tmp/collabview-windows-build-log/windows-tauri-build.log
          git checkout --orphan ci-debug/windows-build-log
          git rm -rf .
          cp /tmp/collabview-windows-build-log/windows-tauri-build.log .
          git add windows-tauri-build.log
          git commit -m "Capture Windows build log"
          git push --force origin HEAD:ci-debug/windows-build-log
      - uses: actions/upload-artifact@v4
        with:
          name: CollabView-windows
          path: |
            target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [macos-build, windows-build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CollabView-macos
          path: dist/macos
      - uses: actions/download-artifact@v4
        with:
          name: CollabView-windows
          path: dist/windows
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
